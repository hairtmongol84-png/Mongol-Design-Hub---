<!DOCTYPE html>

<html lang="mn"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Бүртгүүлэх - Mongol Design Hub</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                            "background": "#f8f9ff",
                            "secondary-fixed-dim": "#ffb690",
                            "secondary-fixed": "#ffdbca",
                            "surface-container-lowest": "#ffffff",
                            "inverse-primary": "#bcc7de",
                            "surface": "#f8f9ff",
                            "surface-container-low": "#eff4ff",
                            "on-tertiary": "#ffffff",
                            "on-background": "#0b1c30",
                            "error": "#ba1a1a",
                            "outline": "#75777d",
                            "surface-container-high": "#dce9ff",
                            "on-secondary-fixed-variant": "#783200",
                            "on-error-container": "#93000a",
                            "surface-dim": "#cbdbf5",
                            "on-primary-fixed-variant": "#3c475a",
                            "surface-bright": "#f8f9ff",
                            "on-error": "#ffffff",
                            "tertiary": "#001815",
                            "outline-variant": "#c5c6cd",
                            "on-surface-variant": "#45474c",
                            "surface-tint": "#545f73",
                            "surface-container": "#e5eeff",
                            "on-tertiary-container": "#28a094",
                            "on-secondary-fixed": "#341100",
                            "inverse-on-surface": "#eaf1ff",
                            "surface-container-highest": "#d3e4fe",
                            "surface-variant": "#d3e4fe",
                            "error-container": "#ffdad6",
                            "on-primary-container": "#8590a6",
                            "primary-fixed-dim": "#bcc7de",
                            "on-primary-fixed": "#111c2d",
                            "primary": "#091426",
                            "secondary-container": "#fd761a",
                            "inverse-surface": "#213145",
                            "secondary": "#9d4300",
                            "primary-container": "#1e293b",
                            "on-tertiary-fixed": "#00201d",
                            "on-secondary-container": "#5c2400",
                            "on-tertiary-fixed-variant": "#005049",
                            "on-secondary": "#ffffff",
                            "tertiary-fixed-dim": "#6bd8cb",
                            "tertiary-container": "#002f2a",
                            "primary-fixed": "#d8e3fb",
                            "tertiary-fixed": "#89f5e7",
                            "on-primary": "#ffffff",
                            "on-surface": "#0b1c30"
                    },
                    "borderRadius": {
                            "DEFAULT": "0.25rem",
                            "lg": "0.5rem",
                            "xl": "0.75rem",
                            "full": "9999px"
                    },
                    "spacing": {
                            "container-max": "1280px",
                            "margin": "32px",
                            "gutter": "24px",
                            "base": "8px"
                    },
                    "fontFamily": {
                            "headline-xl": ["Inter"],
                            "body-md": ["Inter"],
                            "label-md": ["Inter"],
                            "label-sm": ["Inter"],
                            "body-lg": ["Inter"],
                            "headline-md": ["Inter"],
                            "headline-lg": ["Inter"]
                    },
                    "fontSize": {
                            "headline-xl": ["40px", { "lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                            "body-md": ["16px", { "lineHeight": "1.5", "fontWeight": "400" }],
                            "label-md": ["14px", { "lineHeight": "1.4", "fontWeight": "600" }],
                            "label-sm": ["12px", { "lineHeight": "1.4", "fontWeight": "500" }],
                            "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }],
                            "headline-md": ["24px", { "lineHeight": "1.3", "fontWeight": "600" }],
                            "headline-lg": ["32px", { "lineHeight": "1.2", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-surface text-on-surface antialiased min-h-screen flex">
<!-- Left Decorative Pane (Hidden on Mobile) -->
<div class="hidden lg:flex lg:flex-1 relative bg-primary-container" data-alt="abstract modern interior design featuring minimalist geometric shapes, natural lighting, and subtle indigo tones creating a sophisticated high-end aesthetic" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDCZANwRsj9mu4m1nvXjcZmDVpAwAajvCIUae0s0jx5pKXD2M4oXGYbuF13PWkJ_ykktx8p5BB34PMTsRtdQ2JaBnaHdcr5HaCWDeoecQW1kq5HjF4ckhy2A868s8us_TSQTjEMFEAfI_gs1TxYxC1QhAkOE74R4VWIVsMfC5_ZeGZUM-0KRH_EpC_ijU35Z3wJEB7jDjGQ44Wqwcrt0qn4moIf62jfARZjnyT8AxHxyFo4iybirGKoJOvpfa6poz_wE3vMH5f8nOU'); background-size: cover; background-position: center;">
<div class="absolute inset-0 bg-gradient-to-t from-primary/90 via-primary/50 to-transparent"></div>
<div class="relative z-10 flex flex-col justify-end p-12 w-full">
<h1 class="font-headline-xl text-headline-xl text-on-primary mb-4">Mongol Design Hub</h1>
<p class="font-body-lg text-body-lg text-primary-fixed opacity-90 max-w-md">Дээд зэрэглэлийн дизайн, урлал, бүтээгдэхүүний найдвартай цахим зах зээлд тавтай морил.</p>
</div>
</div>
<!-- Right Form Pane -->
<div class="flex-1 flex flex-col justify-center items-center p-6 sm:p-12 lg:p-24 bg-surface-container-lowest shadow-[-12px_0_40px_rgba(9,20,38,0.03)] z-10 relative">
<!-- Mobile Logo (Visible only on small screens) -->
<div class="lg:hidden mb-8 w-full max-w-md">
<h1 class="font-headline-md text-headline-md text-primary tracking-tight font-bold">Mongol Design Hub</h1>
</div>
<div class="w-full max-w-md">
<div class="mb-8">
<h2 class="font-headline-lg text-headline-lg text-on-background mb-2">Бүртгүүлэх</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Шинээр бүртгэл үүсгэж мөрөөдлийн бүтээлээ амилуулаарай.</p>
</div>
<form class="space-y-6">
<!-- Role Selection (Bento Grid Style) -->
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-3">Таны үүрэг</label>
<div class="grid grid-cols-3 gap-3">
<!-- Buyer -->
<label class="cursor-pointer relative">
<input class="peer sr-only" name="role" type="radio" value="buyer"/>
<div class="h-full border border-outline-variant rounded-xl p-4 flex flex-col items-center justify-center text-center gap-2 transition-all hover:bg-surface-container-low peer-checked:border-primary peer-checked:bg-primary-fixed peer-checked:text-on-primary-fixed">
<span class="material-symbols-outlined text-outline peer-checked:text-primary">shopping_bag</span>
<span class="font-label-sm text-label-sm text-on-surface-variant peer-checked:text-on-primary-fixed">Худалдан авагч</span>
</div>
</label>
<!-- Designer (Pre-selected for demonstration) -->
<label class="cursor-pointer relative">
<input checked="" class="peer sr-only" name="role" type="radio" value="designer"/>
<div class="h-full border border-outline-variant rounded-xl p-4 flex flex-col items-center justify-center text-center gap-2 transition-all hover:bg-surface-container-low peer-checked:border-primary peer-checked:bg-primary-fixed peer-checked:text-on-primary-fixed shadow-[0_4px_12px_rgba(9,20,38,0.05)]">
<span class="material-symbols-outlined text-outline peer-checked:text-primary" style="font-variation-settings: 'FILL' 1;">palette</span>
<span class="font-label-sm text-label-sm text-on-surface-variant peer-checked:text-on-primary-fixed">Дизайнер</span>
<div class="absolute top-2 right-2 hidden peer-checked:block">
<span class="material-symbols-outlined text-primary text-[16px]">check_circle</span>
</div>
</div>
</label>
<!-- Seller -->
<label class="cursor-pointer relative">
<input class="peer sr-only" name="role" type="radio" value="seller"/>
<div class="h-full border border-outline-variant rounded-xl p-4 flex flex-col items-center justify-center text-center gap-2 transition-all hover:bg-surface-container-low peer-checked:border-primary peer-checked:bg-primary-fixed peer-checked:text-on-primary-fixed">
<span class="material-symbols-outlined text-outline peer-checked:text-primary">storefront</span>
<span class="font-label-sm text-label-sm text-on-surface-variant peer-checked:text-on-primary-fixed">Борлуулагч</span>
</div>
</label>
</div>
</div>
<!-- Form Fields -->
<div class="space-y-4">
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-1" for="fullName">Овог нэр</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">person</span>
</div>
<input class="block w-full pl-10 pr-3 py-3 border border-outline-variant rounded-lg bg-surface-container-lowest text-on-background font-body-md text-body-md focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary placeholder:text-outline-variant transition-colors" id="fullName" placeholder="Таны бүтэн нэр" type="text"/>
</div>
</div>
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-1" for="email">Имэйл</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">mail</span>
</div>
<input class="block w-full pl-10 pr-3 py-3 border border-outline-variant rounded-lg bg-surface-container-lowest text-on-background font-body-md text-body-md focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary placeholder:text-outline-variant transition-colors" id="email" placeholder="name@example.com" type="email"/>
</div>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-1" for="password">Нууц үг</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">lock</span>
</div>
<input class="block w-full pl-10 pr-3 py-3 border border-outline-variant rounded-lg bg-surface-container-lowest text-on-background font-body-md text-body-md focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary placeholder:text-outline-variant transition-colors" id="password" placeholder="••••••••" type="password"/>
</div>
</div>
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-1" for="confirmPassword">Нууц үг давтах</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">lock_reset</span>
</div>
<input class="block w-full pl-10 pr-3 py-3 border border-outline-variant rounded-lg bg-surface-container-lowest text-on-background font-body-md text-body-md focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary placeholder:text-outline-variant transition-colors" id="confirmPassword" placeholder="••••••••" type="password"/>
</div>
</div>
</div>
</div>
<!-- Terms -->
<div class="flex items-start">
<div class="flex items-center h-5">
<input class="w-4 h-4 border border-outline-variant rounded bg-surface-container-lowest text-primary focus:ring-primary focus:ring-offset-0" id="terms" type="checkbox"/>
</div>
<div class="ml-3 font-body-md text-body-md">
<label class="text-on-surface-variant" for="terms">
                            Би <a class="font-label-md text-label-md text-primary hover:text-inverse-surface underline decoration-primary-fixed-dim underline-offset-2" href="#">үйлчилгээний нөхцөл</a> болон <a class="font-label-md text-label-md text-primary hover:text-inverse-surface underline decoration-primary-fixed-dim underline-offset-2" href="#">нууцлалын бодлогыг</a> уншиж танилцсан бөгөөд зөвшөөрч байна.
                        </label>
</div>
</div>
<!-- Submit Button -->
<button class="w-full flex justify-center py-3.5 px-4 border border-transparent rounded-lg shadow-sm text-on-primary bg-primary hover:bg-inverse-surface focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors duration-200" type="button">
<span class="font-label-md text-label-md">Бүртгүүлэх</span>
</button>
</form>
<div class="mt-8 text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                    Аль хэдийн бүртгэлтэй юу? 
                    <a class="font-label-md text-label-md text-primary hover:text-inverse-surface ml-1 transition-colors" href="#">Нэвтрэх</a>
</p>
</div>
</div>
</div>
<script src="assets/site.js"></script></body></html>
