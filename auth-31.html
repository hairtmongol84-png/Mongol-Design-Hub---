<div class="w-16 h-16 mx-auto bg-surface-container rounded-full flex items-center justify-center mb-4 border border-outline-variant/20 shadow-sm">
<span class="material-symbols-outlined text-primary text-[32px]">lock_reset</span>
</div>
<h1 class="font-headline-md text-headline-md text-on-surface">Нууц үг сэргээх</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Бүртгэлтэй имэйл хаягаа оруулж нууц үг сэргээх холбоос хүлээн авна уу.</p>
</div>
<!-- Form Section -->
<form action="#" class="flex flex-col gap-6" method="POST">
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface" for="email">Имэйл хаяг</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-[20px]">mail</span>
</div>
<input class="w-full pl-10 pr-4 py-3 bg-surface-container-lowest border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-colors" id="email" name="email" placeholder="Имэйл хаягаа оруулна уу" required="" type="email"/>
</div>
</div>
<div class="flex flex-col gap-4 mt-2">
<button class="w-full py-3 px-6 bg-primary text-on-primary font-label-md text-label-md rounded-lg shadow-sm hover:bg-primary-container transition-all active:scale-[0.98] flex items-center justify-center gap-2" type="submit">
<span>Илгээх</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
<a class="w-full py-3 px-6 bg-transparent text-primary font-label-md text-label-md rounded-lg border border-transparent hover:bg-surface-container-low transition-colors flex items-center justify-center" href="#">
                        Буцах
                    </a>
</div>
</form>
